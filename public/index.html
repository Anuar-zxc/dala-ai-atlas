<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#121f22">
  <meta name="description" content="Интерактивная карта ИИ-компаний и проектов Казахстана. Поиск по компаниям, сферам, городам и выпускам nFactorial Incubator.">
  <title>Dala Atlas — карта ИИ-экосистемы Казахстана</title>
  <link rel="icon" href="/mark.svg">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#catalog">Перейти к каталогу</a>
  <header>
    <div class="nav wrap">
      <a class="brand" href="/" aria-label="Dala Atlas, на главную"><img src="/mark.svg" alt="">Dala<span>Atlas</span></a>
      <nav aria-label="Навигация"><a href="#map">Карта</a><a href="#catalog">Каталог</a><button id="about">О проекте</button></nav>
      <button class="add" id="add">Добавить стартап <span aria-hidden="true">＋</span></button>
    </div>
  </header>
  <main class="wrap">
    <div class="intro">
      <div>
        <div class="eyebrow"><i></i> КАЗАХСТАН / ИИ-ЭКОСИСТЕМА</div>
        <h1>Атлас ИИ-стартапов</h1>
        <p>Компании и проекты инкубатора на одной карте.</p>
      </div>
      <div class="atlas-stats" id="stats" aria-label="Статистика каталога"></div>
    </div>
    <section class="atlas" id="map" aria-label="Интерактивная карта проектов">
      <div class="atlas-map">
        <div class="map-heading"><div><span class="coordinates">48° N / 68° E</span><h2>Казахстан</h2></div><span class="north" aria-label="Север">↑ N</span></div>
        <div class="map-frame"><img src="/map.svg" alt="Контурная карта Казахстана и соседних стран"><div class="pins" id="pins"></div></div>
        <div class="map-key"><span><i></i> Город команды</span><span><i class="program"></i> Место инкубатора</span><button class="country-group" id="country-group" hidden></button></div>
      </div>
      <aside class="map-directory">
        <label for="map-group">Проекты на карте</label>
        <select id="map-group" aria-label="Выбрать отметку на карте"><option value="all">Все проекты</option></select>
        <div class="map-list" id="map-list" aria-label="Карточки на карте" tabindex="0"></div>
        <button id="map-catalog" class="map-catalog">Открыть в каталоге <span aria-hidden="true">↗</span></button>
      </aside>
    </section>
    <section class="directory" id="catalog" aria-labelledby="catalog-title">
      <div class="sectionhead"><h2 id="catalog-title">Каталог проектов</h2><span id="count" role="status">Загрузка каталога…</span></div>
      <div class="filters">
        <label class="search"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input type="search" id="query" aria-label="Поиск по каталогу" placeholder="Название, команда или продукт"></label>
        <select id="sector" aria-label="Сфера"><option value="">Все сферы</option></select>
        <select id="city" aria-label="География"><option value="">Вся география</option></select>
        <select id="batch" aria-label="Выпуск"><option value="">Все выпуски</option></select>
      </div>
      <button id="reset" class="bare" hidden>Сбросить фильтры ×</button>
      <div class="grid" id="cards"></div>
      <div class="pages" id="pages" aria-label="Страницы каталога"></div>
    </section>
  </main>
  <footer class="wrap"><b>Dala Atlas</b><button class="bare" id="about-footer">О проекте и источниках</button><a href="#map">К карте ↑</a></footer>
  <dialog id="dialog" aria-labelledby="title"><button class="close" aria-label="Закрыть">×</button><div id="content"></div></dialog>
</body>
</html>
